name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, generation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            generation/requirements-dev.txt
      - run: pip install -r ${{ matrix.service }}/requirements.txt -r generation/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: ${{ matrix.service }}
