<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generation Feed</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05070f;
      color: #e6f1ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .stage img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transition: opacity 400ms ease;
    }
    .stage img.prev { position: absolute; opacity: 0; }
    .meta {
      position: fixed;
      bottom: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.75;
      pointer-events: none;
    }
    .meta .sector {
      font-weight: 600;
      letter-spacing: 2px;
    }
    .meta .prompt {
      max-width: 60ch;
      text-align: right;
      font-style: italic;
    }
    .waiting {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="waiting" id="waiting">Waiting for first generation…</div>
  <div class="meta">
    <span class="sector" id="sector"></span>
    <span class="prompt" id="prompt"></span>
  </div>
  <script type="module" src="feed.js"></script>
</body>
</html>
