version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: blinkpatch-backend
    environment:
      - PATCH_ASSETS_DIR=/app/assets/patches
      # The following are needed for the backend to connect to Pupil Core
      # running on the host machine.
      - PUPIL_HOST=host.docker.internal
      - PUPIL_REMOTE_PORT=50020
      # Reach the generation service by its compose service name. Without
      # this, GENERATION_API defaults to localhost:8001, which is the backend
      # container itself, and the blink relay POST silently fails.
      - GENERATION_API=http://generation:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount local assets so new generated patches are visible without
      # rebuilding the image.
      - ./assets:/app/assets:ro
    ports:
      - "8000:8000"
    networks:
      - blinkpatch-net

  generation:
    build:
      context: .
      dockerfile: docker/generation.Dockerfile
    container_name: blinkpatch-generation
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./assets:/app/assets:rw
      - ./generation:/app/generation:ro
    ports:
      - "8001:8001"
    networks:
      - blinkpatch-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: blinkpatch-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - blinkpatch-net

networks:
  blinkpatch-net:
    driver: bridge
